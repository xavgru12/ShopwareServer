version: '3'

services:
###> shopware/core ###
  database:
    image: mysql:${MYSQL_VERSION:-8}-oracle
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shopware}
      # You should definitely change the password in production
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-!ChangeMe!}
      MYSQL_USER: ${MYSQL_USER:-shopware}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
    volumes:
      - db-data:/var/lib/mysql:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/mysql:rw
    command:
      - --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --log_bin_trust_function_creators=1
      - --group_concat_max_len=320000
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 20
###< shopware/core ###

###> shopware/elasticsearch ###
  opensearch:
    image: opensearchproject/opensearch:2
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    environment:
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: 'c3o_ZPHo!'
      discovery.type: single-node
      plugins.security.disabled: 'true'
###< shopware/elasticsearch ###

###> shopware/docker-dev ###
  web:
    image: ghcr.io/shopware/docker-dev:php8.3-node24-caddy
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - 127.0.0.1:8000:8000
      - 127.0.0.1:9999:9999
      - 127.0.0.1:9998:9998
      - 127.0.0.1:5173:5173
      - 127.0.0.1:5773:5773
    env_file:
      - .env.local
    environment:
      HOST: 0.0.0.0
      APP_ENV: debug
      APP_SECRET: 1e953eeb53c7ef5a6c61569fb3238834
      DATABASE_URL: mysql://shopware:%21ChangeMe%21@database:3306/shopware
      MAILER_DSN: smtp://mailer:1025
      TRUSTED_PROXIES: REMOTE_ADDR
      SYMFONY_TRUSTED_PROXIES: REMOTE_ADDR
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy
  adminer:
    image: adminer
    stop_signal: SIGKILL
    depends_on: [ database ]
    environment:
      ADMINER_DEFAULT_SERVER: database
    ports:
      - '9080:8080'
###< shopware/docker-dev ###

volumes:
###> shopware/core ###
  db-data:
###< shopware/core ###

###> shopware/elasticsearch ###
  opensearch-data:
###< shopware/elasticsearch ###
