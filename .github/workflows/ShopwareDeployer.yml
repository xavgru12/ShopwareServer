name: deploy

env:
  # Deployer connection settings, override via repository secrets (Settings -> Secrets and variables -> Actions -> Secrets)
  HOST: ${{ secrets.HOST }}
  USERNAME: ${{ secrets.USERNAME }}

on:
  push:
    # main -> production (yoxa.eu), any other branch -> test (test.yoxa.eu)

# It is important to specify "concurrency" for the workflow,
# to prevent concurrency between different deploys.
concurrency: production_environment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Debug PRIVATE_REPO_KEY
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PRIVATE_REPO_KEY }}" > ~/.ssh/debug_key
          chmod 600 ~/.ssh/debug_key
          ssh-keygen -lf ~/.ssh/debug_key || true
          GIT_SSH_COMMAND="ssh -i ~/.ssh/debug_key -o StrictHostKeyChecking=accept-new" git ls-remote git@github.com:xavgru12/shopware-stripe.git HEAD || true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ssh-key: ${{ secrets.PRIVATE_REPO_KEY }}
          ssh-known-hosts: github.com ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBEmKSENjQEezOmxkZMy7opKgwFB9nkt5YRrYMjNuG5N87uRgg6CLrbo5wAdT/y6v0mKV0U2w0WZ2YB/++Tpockg=

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, simplexml, xml, zip, sodium, opcache
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Deploy to production (yoxa.eu)
        if: github.ref == 'refs/heads/main'
        uses: deployphp/action@master
        with:
          private-key: ${{ secrets.WEBHOST_SSH_SHOPWARE_PRIVATE_KEY }}
          dep: deploy production
          deployer-binary: "vendor/deployer/deployer/dep"
          verbosity: -vvv
          skip-ssh-setup: false

      - name: Deploy to test (test.yoxa.eu)
        if: github.ref != 'refs/heads/main'
        uses: deployphp/action@master
        with:
          private-key: ${{ secrets.WEBHOST_SSH_SHOPWARE_PRIVATE_KEY }}
          dep: deploy test
          deployer-binary: "vendor/deployer/deployer/dep"
          verbosity: -vvv
          skip-ssh-setup: false
